<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formeland — Homewear Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --panel:#F4F4F4;
    --ink:#111111;
    --grey-600:#5A5A5A;
    --grey-400:#8C8C8C;
    --line:#E1E1E1;
    --radius-lg:20px;
    --radius-md:12px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .topbar{
    width:100%;
    border-bottom:1px solid var(--line);
    padding:18px 24px;
  }
  .back-link{
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:.01em;
    color:var(--ink);
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .back-link:hover{ color:var(--grey-600); }
  .wrap{
    max-width:1040px;
    width:100%;
    padding:48px 24px;
    display:grid;
    grid-template-columns:1.05fr 1fr;
    column-gap:72px;
    align-items:start;
  }
  .stage-col, .info-col{
    display:flex;
    flex-direction:column;
  }

  /* ---- PRODUCT IMAGE STAGE ---- */
  .stage{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .stage img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:opacity .2s ease;
    border-radius:var(--radius-sm);
  }
  .stage img.swap{ opacity:0; }
  .stage-meta{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    padding:18px 20px;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--grey-600);
  }
  .stage-index{
    position:absolute;
    bottom:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    padding:16px 20px;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--grey-600);
    border-top:1px solid var(--line);
    background:rgba(255,255,255,.6);
    backdrop-filter:blur(2px);
  }
  .stage-index span:last-child{color:var(--ink); font-weight:500;}

  /* ---- PRODUCT SWITCHER ---- */
  .product-switcher{
    position:relative;
    margin-bottom:24px;
  }
  .switcher-trigger{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px 16px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .switcher-trigger-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .switcher-trigger-left img{
    width:32px;
    height:32px;
    object-fit:cover;
    border-radius:var(--radius-sm);
    background:#fff;
    border:1px solid var(--line);
  }
  .switcher-label-group span{
    display:block;
  }
  .switcher-eyebrow{
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--grey-400);
  }
  .switcher-name{
    font-size:14px;
    font-weight:500;
    color:var(--ink);
  }
  .chevron{
    width:18px;
    height:18px;
    flex-shrink:0;
    transition:transform .2s ease;
    color:var(--grey-600);
  }
  .product-switcher.open .chevron{ transform:rotate(180deg); }

  .switcher-panel{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    right:0;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:8px;
    box-shadow:0 12px 32px rgba(0,0,0,.08);
    z-index:20;
    display:none;
    max-height:320px;
    overflow-y:auto;
  }
  .product-switcher.open .switcher-panel{ display:block; }

  .switcher-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    transition:background .15s ease;
  }
  .switcher-item:hover{ background:var(--panel); }
  .switcher-item.active{ background:var(--panel); }
  .switcher-item img{
    width:40px;
    height:40px;
    object-fit:cover;
    border-radius:var(--radius-sm);
    background:var(--panel);
    border:1px solid var(--line);
  }
  .switcher-item-name{ font-size:13.5px; font-weight:500; }
  .switcher-item-count{ font-size:11px; color:var(--grey-400); margin-top:2px; }

  /* ---- INFO ---- */
  .breadcrumb{
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--grey-400);
    margin-bottom:16px;
  }
  .breadcrumb b{color:var(--ink); font-weight:500;}
  h1{
    font-weight:600;
    font-size:32px;
    line-height:1.2;
    letter-spacing:-.01em;
    margin-bottom:14px;
  }
  .desc{
    font-size:14.5px;
    font-weight:300;
    line-height:1.75;
    color:var(--grey-600);
    margin-top:24px;
    max-width:none;
  }

  .option-label{
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--grey-600);
    margin-bottom:14px;
  }

  .selected-color-name{
    margin-top:14px;
    font-size:13px;
    font-weight:500;
    color:var(--ink);
  }
  .selected-color-name span{
    color:var(--grey-600);
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:11px;
    margin-right:8px;
  }
  .selected-color-code{
    margin-top:4px;
    font-size:12px;
    color:var(--grey-600);
    letter-spacing:.03em;
  }
  .selected-color-code b{
    color:var(--ink);
    font-weight:600;
    font-family:'Inter', sans-serif;
    letter-spacing:.04em;
  }

  .swatches{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:36px;
  }
  .swatch{
    width:52px;
    height:52px;
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    background-size:cover;
    background-position:center;
    transition:border-color .15s ease, transform .15s ease;
  }
  .swatch:hover{ border-color:var(--grey-400); transform:translateY(-1px); }
  .swatch.active{
    border:1.5px solid var(--ink);
    outline:2px solid #fff;
    outline-offset:-4px;
  }

  .save-icon{
    position:absolute;
    top:16px;
    right:16px;
    z-index:3;
    width:38px;
    height:38px;
    border-radius:50%;
    background:#fff;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink);
    transition:background .15s ease, transform .15s ease;
  }
  .save-icon:hover{ background:var(--panel); transform:translateY(-1px); }
  .save-icon svg{ width:17px; height:17px; }

  .specs{
    display:flex;
    gap:32px;
    margin-top:28px;
  }
  .specs div{
    font-size:11px;
    color:var(--grey-400);
    letter-spacing:.05em;
    text-transform:uppercase;
  }
  .specs div b{
    display:block;
    color:var(--ink);
    font-size:13px;
    font-weight:500;
    text-transform:none;
    letter-spacing:0;
    margin-top:4px;
  }

  @media (max-width:760px){
    .stage-col, .info-col{ display:contents; }
    .wrap{
      display:flex;
      flex-direction:column;
      gap:20px;
    }
    .stage-col > *, .info-col > *{ width:100%; }
    .stage{ order:1; width:100%; max-width:320px; margin:0 auto; aspect-ratio:1/1.05; }
    .product-switcher{ order:2; }
    .swatches-block{ order:3; margin-bottom:0; }
    .specs{ order:4; margin-top:0; gap:16px; flex-wrap:wrap; }
    .header-block{ order:5; }
    .desc-block{ order:6; padding-bottom:0; margin-top:0; }

    .stage-meta{ display:none; }
    .stage-index{ padding:12px; font-size:9.5px; }
    .swatches{
      flex-direction:row;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:0;
      max-height:none;
    }
    .swatch{ width:34px; height:34px; border-radius:50%; }
    .option-label{ margin-bottom:10px; }
    .selected-color-name{ margin-top:10px; }
    h1{font-size:22px; margin-bottom:6px;}
    .breadcrumb{ margin-bottom:8px; }
  }

  @media (max-width:420px){
    .wrap{ padding:28px 14px; column-gap:12px; }
    .topbar{ padding:14px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-link">&larr; Back</a>
</div>

<div class="wrap">

  <div class="stage-col">
    <div class="stage">
      <div class="stage-meta">
        <span>Homewear Collection</span>
        <span id="stageCode">01 / 05</span>
      </div>
      <button class="save-icon" aria-label="Save" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>
      <img id="productImage" src="" alt="Product">
      <div class="stage-index">
        <span>Selected color/motif</span>
        <span id="stageLabel"></span>
      </div>
    </div>

    <p class="desc desc-block" id="productDesc"></p>
  </div>

  <div class="info-col">
    <div class="product-switcher" id="productSwitcher">
      <div class="switcher-trigger" id="switcherTrigger">
        <div class="switcher-trigger-left">
          <img id="switcherThumb" src="" alt="">
          <div class="switcher-label-group">
            <span class="switcher-eyebrow">Category</span>
            <span class="switcher-name" id="switcherName"></span>
          </div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <div class="switcher-panel" id="switcherPanel"></div>
    </div>

    <div class="header-block">
      <div class="breadcrumb">Homewear Collection <b id="crumbName"></b></div>
      <h1 id="productName"></h1>
    </div>

    <div class="swatches-block">
      <div class="option-label">Color/Motif</div>
      <div class="swatches" id="swatchContainer"></div>
      <div class="selected-color-name">
        <span>Selected:</span><b id="currentColorName"></b>
        <div class="selected-color-code">Code: <b id="currentColorCode"></b></div>
      </div>
    </div>

    <div class="specs">
      <div>Material<b id="specMaterial"></b></div>
      <div>Size<b id="specSize"></b></div>
      <div>Color/Motif Options<b id="specCount"></b></div>
    </div>
  </div>

</div>

<script>
  /* ============================================================
     PRODUCT DATA
     ------------------------------------------------------------
     Each product has its own name, sku, description, specs, and
     its own list of color options.

     FOLDER STRUCTURE
     ------------------------------------------------------------
     Each collection gets its own folder under images/, with two
     subfolders — one for the big display photos, one for the
     tightly-cropped swatch photos:

       images/
         azure-soap-dispenser/
           main/     → full product photos (used by "img")
           swatch/   → close-up color/motif crops (used by "swatch")
         [next-collection-name]/
           main/
           swatch/

     File names inside each folder should match the color name
     (e.g. natural-oak.png) so it's easy to tell which file is
     which just by looking at the folder — "swatch" points to
     .../swatch/xxx.png and "img" points to .../main/xxx.png,
     same file name, different folder.

     - thumb: small image used in the product switcher list
     - colorOptions[].name: color/motif name shown on the page
     - colorOptions[].code: internal reference code (matches your
       Excel tracking sheet) — shown on the page next to the color
       name so an inquiry can be looked up directly
     - colorOptions[].swatch: image shown inside the small round
       swatch
     - colorOptions[].img: full product photo shown in the big
       stage box when that color is selected

     To add a new collection: copy one whole product block below,
     edit the values, and create a matching images/[name]/main and
     images/[name]/swatch folder pair. To add a color to a
     collection: add one line inside its colorOptions array.
     ============================================================ */
  const products = [
    // Kategori masih kosong — tambahkan produk di sini nanti
  ];

  let currentProductIndex = 0;
  let currentColorIndex = 0;

  const productSwitcher   = document.getElementById('productSwitcher');
  const switcherTrigger   = document.getElementById('switcherTrigger');
  const switcherPanel     = document.getElementById('switcherPanel');
  const switcherThumb     = document.getElementById('switcherThumb');
  const switcherName      = document.getElementById('switcherName');

  const crumbName         = document.getElementById('crumbName');
  const productName       = document.getElementById('productName');
  const productDesc       = document.getElementById('productDesc');
  const specMaterial      = document.getElementById('specMaterial');
  const specSize          = document.getElementById('specSize');
  const specCount         = document.getElementById('specCount');

  const swatchContainer   = document.getElementById('swatchContainer');
  const productImage      = document.getElementById('productImage');
  const stageLabel        = document.getElementById('stageLabel');
  const stageCode         = document.getElementById('stageCode');
  const currentColorName  = document.getElementById('currentColorName');
  const currentColorCode  = document.getElementById('currentColorCode');

  function isUrl(str){
    // Anything that isn't a plain hex color (#fff, #a9822f, etc.) is
    // treated as an image path — this covers http(s) links, data URIs,
    // and relative/local folder paths like "images/.../swatch/x.png".
    return !/^#[0-9a-fA-F]{3,8}$/.test(str.trim());
  }

  function renderSwitcherPanel(){
    switcherPanel.innerHTML = '';
    products.forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'switcher-item' + (i === currentProductIndex ? ' active' : '');
      item.innerHTML = `
        <img src="${p.thumb}" alt="${p.name}">
        <div>
          <div class="switcher-item-name">${p.name}</div>
          <div class="switcher-item-count">${p.colorOptions.length} color/motif options</div>
        </div>
      `;
      item.addEventListener('click', () => {
        loadProduct(i);
        productSwitcher.classList.remove('open');
      });
      switcherPanel.appendChild(item);
    });
  }

  function renderSwatches(){
    const colorOptions = products[currentProductIndex].colorOptions;
    swatchContainer.innerHTML = '';
    colorOptions.forEach((opt, i) => {
      const el = document.createElement('div');
      el.className = 'swatch' + (i === currentColorIndex ? ' active' : '');
      if(isUrl(opt.swatch)){
        el.style.backgroundImage = `url(${opt.swatch})`;
      } else {
        el.style.background = opt.swatch;
      }
      el.title = opt.code ? `${opt.name} — ${opt.code}` : opt.name;
      el.addEventListener('click', () => selectColor(i));
      swatchContainer.appendChild(el);
    });
  }

  function selectColor(index){
    currentColorIndex = index;
    const opt = products[currentProductIndex].colorOptions[index];

    document.querySelectorAll('.swatch').forEach((s, i) => s.classList.toggle('active', i === index));

    productImage.classList.add('swap');
    setTimeout(() => {
      productImage.src = opt.img;
      productImage.alt = opt.name;
      productImage.classList.remove('swap');
    }, 120);

    stageLabel.textContent = opt.code ? `${opt.name} — ${opt.code}` : opt.name;
    currentColorName.textContent = opt.name;
    currentColorCode.textContent = opt.code || "—";
    stageCode.textContent = String(index + 1).padStart(2, '0') + " / " + String(products[currentProductIndex].colorOptions.length).padStart(2, '0');
  }

  function loadProduct(index){
    currentProductIndex = index;
    currentColorIndex = 0;
    const p = products[index];

    switcherThumb.src = p.thumb;
    switcherThumb.alt = p.name;
    switcherName.textContent = p.name;

    crumbName.textContent = "/ " + p.name;
    productName.textContent = p.name;
    productDesc.textContent = p.desc;
    specMaterial.textContent = p.material;
    specSize.textContent = p.size;
    specCount.textContent = p.colorOptions.length;

    renderSwitcherPanel();
    renderSwatches();
    selectColor(0);
  }

  switcherTrigger.addEventListener('click', () => {
    productSwitcher.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if(!productSwitcher.contains(e.target)){
      productSwitcher.classList.remove('open');
    }
  });

  loadProduct(0);
</script>

</body>
</html>
